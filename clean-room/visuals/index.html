<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace · wireframes and mockups</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="gallery">
    <aside class="catalog">
      <div class="catalog-brand"><span class="brand-mark">w</span><div>Workspace studies<small>Clean-room visual reference</small></div></div>
      <nav id="screen-list" aria-label="Design screens"></nav>
      <div class="catalog-footer">Original layouts · synthetic content<br><a href="../README.md">Evidence &amp; coverage</a></div>
    </aside>
    <section class="review">
      <header class="review-toolbar">
        <div><strong id="screen-title"></strong><small id="screen-evidence"></small></div>
        <div class="review-controls">
          <select id="mode" aria-label="Presentation"><option value="mockup">Mockup</option><option value="wireframe">Wireframe</option></select>
          <select id="theme" aria-label="Color theme"><option value="dark">Dark</option><option value="light">Light</option></select>
          <select id="state" aria-label="Example state"><option value="populated">Populated</option><option value="empty">Empty</option><option value="loading">Loading</option><option value="error">Error</option><option value="readonly">Read only</option></select>
        </div>
      </header>
      <div id="stage"><div id="app" tabindex="-1"></div></div>
      <footer id="review-note"></footer>
    </section>
  </div>
  <script src="screens.js"></script>
  <script src="views.js"></script>
  <script src="editors.js"></script>
  <script src="app.js"></script>
</body>
</html>
